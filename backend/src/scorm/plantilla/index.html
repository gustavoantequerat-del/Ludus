<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludus</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="marco">
      <header class="cabecera">
        <div class="marca">
          <span class="logo">L</span>
          <span class="marcaTextos">
            <strong class="marcaNombre">Ludus</strong>
            <span class="marcaSub" id="marca-sub">Sistema de Juegos Educativos</span>
          </span>
        </div>
        <span class="estadoLms" id="estado-lms">Sin conexion al LMS</span>
      </header>

      <main class="contenido">
        <!-- Cargando -->
        <section class="pantalla" id="pantalla-cargando">
          <p class="textoApagado">Cargando modulo...</p>
        </section>

        <!-- Error -->
        <section class="pantalla oculto" id="pantalla-error">
          <div class="tarjeta">
            <h1 class="titulo">No se pudo abrir el modulo</h1>
            <p class="aviso avisoError" id="error-mensaje"></p>
          </div>
        </section>

        <!-- Inicio de sesion del estudiante -->
        <section class="pantalla oculto" id="pantalla-login">
          <form class="tarjeta" id="formulario-login" autocomplete="on">
            <h1 class="titulo" id="login-titulo">Inicia sesion</h1>
            <p class="subtitulo" id="login-subtitulo">
              Entra con tu cuenta de Ludus para registrar tu avance.
            </p>

            <p class="aviso avisoError oculto" id="login-error"></p>

            <label class="campo">
              <span class="etiqueta">Correo</span>
              <input
                class="entrada"
                type="email"
                id="campo-correo"
                name="correo"
                placeholder="correo@institucion.mx"
                autocomplete="username"
                required
              />
            </label>

            <label class="campo">
              <span class="etiqueta">Contrasena</span>
              <input
                class="entrada"
                type="password"
                id="campo-clave"
                name="clave"
                placeholder="Tu contrasena"
                autocomplete="current-password"
                required
              />
            </label>

            <button class="boton botonPrimario" type="submit" id="boton-ingresar">Ingresar</button>
          </form>
        </section>

        <!-- Mesa de Cumplimiento: juego con mecanica real -->
        <section class="pantalla oculto" id="pantalla-mesa">
          <div class="tarjeta tarjetaAncha">
            <div class="filaSuperior">
              <div class="textosJuego">
                <h1 class="titulo" id="mesa-titulo"></h1>
                <p class="subtitulo" id="mesa-instrucciones"></p>
              </div>
              <span class="chipEstudiante" id="mesa-estudiante"></span>
            </div>

            <div class="chips">
              <span class="chip" id="mesa-progreso"></span>
              <span class="chip" id="mesa-aciertos"></span>
              <span class="chip chipCian" id="mesa-tiempo"></span>
            </div>

            <!-- Escena: el CEO entra con su solicitud sobre el fondo del juego. -->
            <div class="escena" id="mesa-escena">
              <span class="escenaVelo"></span>
              <div class="personaje" id="mesa-personaje">
                <img class="personajeImagen oculto" id="mesa-personaje-imagen" alt="" />
                <span class="silueta" id="mesa-silueta"></span>
                <span class="placa oculto" id="mesa-placa">
                  <span class="placaNombre" id="mesa-personaje-nombre"></span>
                  <span class="placaCargo" id="mesa-personaje-cargo"></span>
                </span>
              </div>
              <div class="globo">
                <span class="globoEntidad" id="mesa-entidad"></span>
                <span class="globoTipo" id="mesa-tipo"></span>
                <span class="globoSolicitud" id="mesa-solicitud"></span>
              </div>
            </div>

            <div class="expediente">
              <div class="campos" id="mesa-campos"></div>
            </div>

            <div class="decisiones" id="mesa-decisiones"></div>

            <div class="veredicto oculto" id="mesa-veredicto">
              <div class="veredictoCabecera" id="mesa-veredicto-titulo"></div>
              <div class="veredictoRegla" id="mesa-veredicto-regla"></div>
              <p class="veredictoExplicacion" id="mesa-veredicto-explicacion"></p>
              <div class="filaInferior">
                <span class="veredictoOrigen" id="mesa-veredicto-origen"></span>
                <button class="boton botonPrimario" type="button" id="mesa-siguiente"></button>
              </div>
            </div>
          </div>
        </section>

        <!-- Memorama (ludico): juego-memorama.js -->
        <section class="pantalla oculto" id="pantalla-memorama">
          <div class="tarjeta tarjetaAncha">
            <div class="filaSuperior">
              <div class="textosJuego">
                <h1 class="titulo" id="memorama-titulo"></h1>
                <p class="subtitulo" id="memorama-instrucciones"></p>
              </div>
              <span class="chipEstudiante" id="memorama-estudiante"></span>
            </div>
            <div class="chips">
              <span class="chip" id="memorama-ronda"></span>
              <span class="chip" id="memorama-parejas"></span>
              <span class="chip" id="memorama-movimientos"></span>
              <span class="chip chipCian" id="memorama-tiempo"></span>
            </div>
            <div class="mesaFichas" id="memorama-mesa">
              <div class="memoramaTablero" id="memorama-tablero"></div>
              <div class="avisoMesa oculto" id="memorama-aviso">
                <strong class="avisoMesaTitulo" id="memorama-aviso-titulo"></strong>
                <button class="boton botonPrimario" type="button" id="memorama-siguiente">Siguiente ronda</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Mahjong (ludico): juego-mahjong.js -->
        <section class="pantalla oculto" id="pantalla-mahjong">
          <div class="tarjeta tarjetaAncha">
            <div class="filaSuperior">
              <div class="textosJuego">
                <h1 class="titulo" id="mahjong-titulo"></h1>
                <p class="subtitulo" id="mahjong-instrucciones"></p>
              </div>
              <span class="chipEstudiante" id="mahjong-estudiante"></span>
            </div>
            <div class="barraJuego">
              <span class="chip" id="mahjong-fichas"></span>
              <span class="chip" id="mahjong-barajadas"></span>
              <span class="chip chipCian" id="mahjong-tiempo"></span>
              <span class="espaciador"></span>
              <button class="boton botonSecundario" type="button" id="mahjong-pista">Pista</button>
              <button class="boton botonSecundario" type="button" id="mahjong-barajar">Barajar</button>
              <button class="boton botonSecundario" type="button" id="mahjong-terminar">Terminar</button>
            </div>
            <div class="mesaFichas mesaMahjong" id="mahjong-mesa">
              <div class="mahjongTablero" id="mahjong-tablero"></div>
              <div class="avisoMesa oculto" id="mahjong-aviso">
                <strong class="avisoMesaTitulo" id="mahjong-aviso-titulo"></strong>
                <p class="avisoMesaTexto" id="mahjong-aviso-texto"></p>
                <button class="boton botonPrimario" type="button" id="mahjong-aviso-boton"></button>
              </div>
            </div>
          </div>
        </section>

        <!-- Runner Narrativo (evaluacion): juego-runner.js -->
        <section class="pantalla oculto" id="pantalla-runner">
          <div class="tarjeta tarjetaAncha">
            <div class="filaSuperior">
              <div class="textosJuego">
                <h1 class="titulo" id="runner-titulo"></h1>
              </div>
              <span class="chipEstudiante" id="runner-estudiante"></span>
            </div>
            <div class="runnerCamino" id="runner-camino"></div>
            <div class="runnerPantalla">
              <!-- Reproductor de YouTube o Drive: lo arma juego-runner.js en cada video -->
              <div class="runnerVideo oculto" id="runner-video">
                <div class="runnerMarco" id="runner-marco"></div>
                <div class="runnerVideoPie oculto" id="runner-video-pie">
                  <span class="runnerVideoAyuda" id="runner-video-ayuda"></span>
                  <button class="boton botonPrimario" type="button" id="runner-continuar">Continuar</button>
                </div>
              </div>
              <div class="runnerLienzo" id="runner-lienzo">
                <strong class="runnerLienzoTexto" id="runner-lienzo-texto"></strong>
              </div>
              <div class="runnerCapa" id="runner-portada">
                <strong class="runnerCapaTitulo" id="runner-portada-titulo"></strong>
                <p class="runnerCapaTexto" id="runner-portada-texto"></p>
                <span class="runnerCapaDato" id="runner-portada-dato"></span>
                <button class="boton botonPrimario" type="button" id="runner-comenzar">Comenzar</button>
              </div>
              <div class="runnerCapa runnerCapaPregunta oculto" id="runner-pregunta">
                <span class="runnerNumero" id="runner-numero"></span>
                <strong class="runnerPreguntaTexto" id="runner-pregunta-texto"></strong>
                <div class="runnerOpciones" id="runner-opciones"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Ajedrez de Preguntas (evaluacion): ajedrez-motor.js + juego-ajedrez.js -->
        <section class="pantalla oculto" id="pantalla-ajedrez">
          <div class="tarjeta tarjetaAncha">
            <div class="filaSuperior">
              <div class="textosJuego">
                <h1 class="titulo" id="ajedrez-titulo"></h1>
              </div>
              <span class="chipEstudiante" id="ajedrez-estudiante"></span>
            </div>

            <div id="ajedrez-portada" class="ajedrezPortada">
              <p class="subtitulo" id="ajedrez-instrucciones"></p>
              <ul class="ajedrezReglas" id="ajedrez-reglas"></ul>
              <div class="ajedrezPortadaAcciones">
                <button class="boton botonSecundario" type="button" id="ajedrez-ver-tutorial">No se jugar: ver tutorial</button>
                <button class="boton botonPrimario" type="button" id="ajedrez-comenzar">Comenzar</button>
              </div>
            </div>

            <div id="ajedrez-mesa" class="ajedrezMesa oculto">
              <div class="chips">
                <span class="chip chipCian oculto" id="ajedrez-tiempo"></span>
                <span class="chip" id="ajedrez-marcador"></span>
                <span class="chip" id="ajedrez-minimo"></span>
              </div>
              <p class="ajedrezMensaje" id="ajedrez-mensaje"></p>
              <div class="ajedrezZona">
                <div class="ajedrezTablero" id="ajedrez-tablero"></div>
                <div class="ajedrezVelo oculto" id="ajedrez-velo">
                  <div class="ajedrezTarjeta" id="ajedrez-tarjeta">
                    <span class="ajedrezContexto" id="ajedrez-contexto"></span>
                    <p class="aviso avisoError oculto" id="ajedrez-aviso"></p>
                    <strong class="ajedrezPregunta" id="ajedrez-pregunta"></strong>
                    <div class="ajedrezOpciones" id="ajedrez-opciones"></div>
                    <div class="ajedrezResultado oculto" id="ajedrez-resultado">
                      <span id="ajedrez-resultado-texto"></span>
                      <button class="boton botonPrimario" type="button" id="ajedrez-continuar">Continuar</button>
                    </div>
                    <div class="ajedrezAcciones oculto" id="ajedrez-critica">
                      <button class="boton botonSecundario" type="button" id="ajedrez-cancelar">Elegir otra jugada</button>
                      <button class="boton botonPrimario" type="button" id="ajedrez-aceptar">Responder</button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="ajedrezPie">
                <button class="boton botonSecundario" type="button" id="ajedrez-tutorial-abrir">Como se mueven</button>
                <button class="boton botonSecundario" type="button" id="ajedrez-examen">Tomar examen</button>
                <button class="boton botonSecundario" type="button" id="ajedrez-rendirse">Rendirse</button>
              </div>
            </div>

            <!-- Mini tutorial: los pasos y dibujos vienen de ajedrez-motor.js -->
            <div class="tutFondo oculto" id="ajedrez-tutorial" role="dialog" aria-modal="true" aria-labelledby="tut-titulo">
              <div class="tutCaja">
                <div class="tutCabecera">
                  <div>
                    <span class="tutContador" id="tut-contador"></span>
                    <h2 class="tutTitulo" id="tut-titulo"></h2>
                  </div>
                  <button class="tutCerrar" type="button" id="tut-cerrar" aria-label="Cerrar tutorial">&times;</button>
                </div>
                <div class="tutCuerpo" id="tut-cuerpo">
                  <div class="tutIlustracion" id="tut-ilustracion"></div>
                  <div class="tutTexto" id="tut-texto"></div>
                </div>
                <div class="tutPie">
                  <div class="tutPuntos" id="tut-puntos"></div>
                  <div class="tutAcciones">
                    <button class="boton botonSecundario" type="button" id="tut-anterior">Anterior</button>
                    <button class="boton botonPrimario" type="button" id="tut-siguiente">Siguiente</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Repaso de la partida -->
        <section class="pantalla oculto" id="pantalla-repaso">
          <div class="tarjeta tarjetaAncha">
            <h1 class="titulo">Partida terminada</h1>
            <div class="chips">
              <span class="chip" id="repaso-puntaje"></span>
              <span class="chip" id="repaso-aciertos"></span>
              <span class="chip" id="repaso-exceso"></span>
              <span class="chip" id="repaso-omision"></span>
            </div>
            <p class="aviso avisoExito" id="repaso-nota"></p>
            <div id="repaso-detalle"></div>
            <p class="textoApagado" id="repaso-lms"></p>
          </div>
        </section>


        <!-- Resultado -->
        <section class="pantalla oculto" id="pantalla-resultado">
          <div class="tarjeta">
            <h1 class="titulo">Modulo completado</h1>
            <div class="puntajeFila">
              <span class="puntajeGrande" id="resultado-puntaje">0</span>
              <span class="textoApagado" id="resultado-maximo"></span>
            </div>
            <div class="barra"><div class="barraRelleno" id="resultado-barra"></div></div>
            <p class="aviso avisoExito" id="resultado-nota"></p>
            <p class="textoApagado" id="resultado-detalle"></p>
            <p class="textoApagado" id="resultado-lms"></p>
            <button class="boton botonSecundario" type="button" id="boton-reintentar">
              Reintentar
            </button>
          </div>
        </section>
      </main>
    </div>

    <script src="configuracion.js"></script>
    <script src="ludus-scorm.js"></script>
    <script src="juego-memorama.js"></script>
    <script src="juego-mahjong.js"></script>
    <script src="juego-runner.js"></script>
    <script src="ajedrez-motor.js"></script>
    <script src="juego-ajedrez.js"></script>
  </body>
</html>
